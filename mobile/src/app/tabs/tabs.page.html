<ion-tabs>
  <ion-tab-bar slot="bottom">
    <ion-tab-button tab="home" aria-label="Home">
      <ion-icon aria-hidden="true" name="home"></ion-icon>
      <ion-label>Home</ion-label>
    </ion-tab-button>

    <ion-tab-button tab="explore" aria-label="Boat routes">
      <ion-icon aria-hidden="true" name="boat"></ion-icon>
      <ion-label>Routes</ion-label>
    </ion-tab-button>

    <ion-tab-button tab="events" aria-label="Local events">
      <ion-icon aria-hidden="true" name="calendar"></ion-icon>
      <ion-label>Events</ion-label>
    </ion-tab-button>

    <ion-tab-button tab="map" aria-label="Map">
      <ion-icon aria-hidden="true" name="map"></ion-icon>
      <ion-label>Map</ion-label>
    </ion-tab-button>

    <ion-tab-button tab="favorites" aria-label="Favorites">
      <ion-icon aria-hidden="true" name="heart"></ion-icon>
      <ion-label>Favorite</ion-label>
    </ion-tab-button>

    <ion-tab-button tab="trips" aria-label="Trips">
      <ion-icon aria-hidden="true" name="calendar"></ion-icon>
      <ion-label>Trips</ion-label>
    </ion-tab-button>
  </ion-tab-bar>
